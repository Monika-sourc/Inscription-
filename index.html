<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - FinanceExpress</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        h1 { color: #1e1b4b; margin-bottom: 10px; text-align: center; }
        p { color: #64748b; text-align: center; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #fbbf24;
            color: #1e1b4b;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #f59e0b; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .error { color: #dc2626; font-size: 14px; margin-top: 10px; text-align: center; }
        .success { color: #16a34a; font-size: 14px; margin-top: 10px; text-align: center; }
        
        /* PARTIE CONNECTÉE - CACHÉE PAR DÉFAUT */
        #dashboard {
            display: none;
            text-align: center;
        }
        #dashboard h2 { color: #16a34a; margin-bottom: 20px; }
        .logout { background: #dc2626; color: white; margin-top: 20px; }
        .logout:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- PARTIE 1 : FORMULAIRE D'INSCRIPTION -->
        <div id="signupForm">
            <h1>Créer un compte</h1>
            <p>Rejoignez FinanceExpress en 30 secondes</p>
            
            <input type="email" id="email" placeholder="Votre email" required>
            <input type="password" id="password" placeholder="Mot de passe (6 caractères min)" required>
            <button id="signupBtn">S'inscrire</button>
            
            <div id="message"></div>
            
            <p style="font-size: 12px; color: #64748b; margin-top: 15px;">
                Vous recevrez un email de vérification de Google Firebase.
            </p>
        </div>

        <!-- PARTIE 2 : DASHBOARD APRÈS CONNEXION -->
        <div id="dashboard">
            <h2>✅ Vous êtes connecté !</h2>
            <p>Bienvenue <strong id="userEmail"></strong></p>
            <p style="margin: 20px 0;">Votre compte est actif. Vous pouvez maintenant faire une demande de prêt.</p>
            <button onclick="window.location.href='demande-pret.html'">Faire une demande</button>
            <button class="logout" id="logoutBtn">Se déconnecter</button>
        </div>

    </div>

    <!-- FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // TA CONFIG FIREBASE ICI
        const firebaseConfig = {
            apiKey: "AIzaSyC_JmwDkBxZ0DFBXfMO57cFcOFeLXZwcx8",
            authDomain: "finance-express-v2-77e21.firebaseapp.com",
            projectId: "finance-express-v2-77e21",
            storageBucket: "finance-express-v2-77e21.firebasestorage.app",
            messagingSenderId: "61877127775",
            appId: "1:61877127775:web:c89282a132367ba76eab37"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const signupForm = document.getElementById('signupForm');
        const dashboard = document.getElementById('dashboard');
        const signupBtn = document.getElementById('signupBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const message = document.getElementById('message');
        const userEmail = document.getElementById('userEmail');

        // 1. INSCRIPTION
        signupBtn.addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            signupBtn.disabled = true;
            signupBtn.textContent = 'Inscription...';
            message.textContent = '';

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await sendEmailVerification(userCredential.user);
                
                message.className = 'success';
                message.textContent = 'Compte créé ! Vérifiez votre email.';
                
                // Firebase connecte automatiquement l'user après inscription
                // onAuthStateChanged va s'occuper d'afficher le dashboard
                
            } catch (error) {
                message.className = 'error';
                if (error.code === 'auth/email-already-in-use') {
                    message.textContent = 'Cet email est déjà utilisé. Connectez-vous.';
                } else if (error.code === 'auth/weak-password') {
                    message.textContent = 'Mot de passe trop faible. 6 caractères min.';
                } else {
                    message.textContent = 'Erreur : ' + error.message;
                }
                signupBtn.disabled = false;
                signupBtn.textContent = "S'inscrire";
            }
        });

        // 2. DÉTECTE SI L'USER EST CONNECTÉ OU PAS
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // USER CONNECTÉ → ON CACHE LE FORMULAIRE, ON MONTRE LE DASHBOARD
                signupForm.style.display = 'none';
                dashboard.style.display = 'block';
                userEmail.textContent = user.email;
            } else {
                // USER PAS CONNECTÉ → ON MONTRE LE FORMULAIRE
                signupForm.style.display = 'block';
                dashboard.style.display = 'none';
            }
        });

        // 3. DÉCONNEXION
        logoutBtn.addEventListener('click', () => {
            signOut(auth);
        });

    </script>
</body>
</html>
